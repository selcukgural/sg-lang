# The tests on Windows (design/04, "Windows, the direction"): every push to `main` runs
# `cargo test` on x86-64 and on 64-bit Arm. Nobody waits for them: what they find is noted and
# made right. Linux and macOS are tested where the code is written. The only actions are GitHub's
# own checkout and cache, pinned to their commits; the token only reads.
name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: interpreter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust and LLVM come with GitHub's images of Windows; a machine without them fails here.
      - name: Tools
        run: |
          cargo --version
          $clang = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = 'C:\Program Files\LLVM\bin\clang.exe' }
          & $clang --version
      # The libraries of the examples and tests (zlib, SQLite, curl) come from vcpkg as DLLs with
      # their import libraries (design/04, "Windows, the direction"; choices 1053 and 1064). The
      # vcpkg of GitHub's image is taken where it is there, else vcpkg at a fixed commit; what it
      # builds is kept between runs by GitHub's cache, under the commit of vcpkg.
      - name: vcpkg
        id: vcpkg
        env:
          PINNED: 9eec002df1cd109f8f104cd966a763daf9751489 # 2026.10.16
          ARCHIVES: ${{ runner.temp }}\vcpkg-archives
          FRESH: ${{ runner.temp }}\vcpkg
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path "$root\vcpkg.exe")) {
            git clone --quiet https://github.com/microsoft/vcpkg.git $env:FRESH
            git -C $env:FRESH checkout --quiet $env:PINNED
            & "$env:FRESH\bootstrap-vcpkg.bat" -disableMetrics
            $root = $env:FRESH
          }
          New-Item -ItemType Directory -Force $env:ARCHIVES | Out-Null
          "root=$root" >> $env:GITHUB_OUTPUT
          "commit=$(git -C $root rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "VCPKG_DEFAULT_BINARY_CACHE=$env:ARCHIVES" >> $env:GITHUB_ENV
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: vcpkg-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-zlib-sqlite3-curl
      - name: Libraries
        env:
          VCPKG_ROOT: ${{ steps.vcpkg.outputs.root }}
        run: |
          $triplet = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64-windows' } else { 'x64-windows' }
          & "$env:VCPKG_ROOT\vcpkg.exe" install zlib sqlite3 curl --triplet $triplet --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = "$env:VCPKG_ROOT\installed\$triplet"
          "SG_TEST_LIB_DIRS=$installed\lib;$installed\bin" >> $env:GITHUB_ENV
          # The headers, for a C file beside a program that includes one (`tests/modules/cfile`):
          # Clang reads `CPATH` as more folders of `#include <...>`.
          "CPATH=$installed\include" >> $env:GITHUB_ENV
      # QEMU, for the kernel of `examples/kernel` (`tests/kernel.rs`): the build of each machine
      # that qemu.org points to, at a fixed version, its installer checked against its SHA-256
      # and kept by GitHub's cache; it goes where its installer puts it, `C:\Program Files\qemu`.
      - name: QEMU version
        id: qemu
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') {
            "url=https://qemu.weilnetz.de/aarch64/2026/qemu-arm-setup-20260811.exe" >> $env:GITHUB_OUTPUT
            "sha256=58bf65887e4d3af1eef705bdecdcb1fa25dead950fc970c20e6094662afc957f" >> $env:GITHUB_OUTPUT
          } else {
            "url=https://qemu.weilnetz.de/w64/2026/qemu-w64-setup-20260811.exe" >> $env:GITHUB_OUTPUT
            "sha256=f98a8aeb5f7faea9765b6dee28316c266cd179d80354a2fed8e50176f9a2e59f" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\qemu-setup.exe
          key: qemu-${{ steps.qemu.outputs.sha256 }}
      - name: QEMU
        env:
          URL: ${{ steps.qemu.outputs.url }}
          SHA256: ${{ steps.qemu.outputs.sha256 }}
          SETUP: ${{ runner.temp }}\qemu-setup.exe
        run: |
          if (-not (Test-Path $env:SETUP)) { Invoke-WebRequest -Uri $env:URL -OutFile $env:SETUP }
          $got = (Get-FileHash -Algorithm SHA256 $env:SETUP).Hash.ToLower()
          if ($got -ne $env:SHA256) { Remove-Item $env:SETUP; throw "QEMU's installer has the SHA-256 $got, not $env:SHA256" }
          Start-Process -Wait -FilePath $env:SETUP -ArgumentList '/S'
          & 'C:\Program Files\qemu\qemu-system-riscv64.exe' --version
      - name: Tests
        run: cargo test --release
