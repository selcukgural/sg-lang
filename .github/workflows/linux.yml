# The tests on Linux (choice 1754): every push to `main` runs the whole `cargo test --release` on
# GitHub's Ubuntu, for whether it is right, not how fast it is (the numbers are measured on a
# machine of our own, `trials/server/measure.py`). Among them is the stand of the server lane
# (`tests/cli.rs`, `the_servers_stand`): 10,000 connections that reset, close half, send a byte at
# a time, do not read, send what is not the protocol, and SIGTERM, against the servers built for
# release and under the sanitizers; and, on a machine narrowed to 100 local ports, a client that
# runs out of them. The only action is GitHub's own checkout, pinned to its
# commit; the token only reads.
name: linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: interpreter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Clang and LLD build for the RISC-V machine and QEMU boots the kernel of `examples/kernel`
      # (`tests/kernel.rs`); zlib, SQLite and curl are the libraries of the examples and tests.
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-misc zlib1g-dev libsqlite3-dev libcurl4-openssl-dev
          cargo --version
          clang --version
      # What the machine gives: its memory, how it counts what programs may take (a `fork` of the
      # tests was once refused with ENOMEM), and its limits.
      - name: Machine
        run: |
          nproc
          free -m
          cat /proc/sys/vm/overcommit_memory /proc/sys/vm/overcommit_ratio
          grep -i commit /proc/meminfo
          ulimit -a
      - name: Tests
        run: cargo test --release
      # A client whose local ports run out (choice 1751 i): the range narrowed to 100 ports after
      # the other tests, which it would starve, and the one test alone.
      - name: Out of local ports
        env:
          SG_PORTS_NARROWED: "1"
        run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="40000 40099"
          cargo test --release --test cli a_client_out_of_local_ports -- --nocapture
