# Dependency updates: the GitHub Actions of the CI, the crate that fuzzes the front end (`fuzz/`,
# which uses libfuzzer-sys), the extension for VS Code (`editors/vscode`, which uses
# vscode-languageclient), the web site (`website/`, Docusaurus), the Rust versions of the trials
# (`trials/`, Rust's `regex`; the Zig versions use only Zig's library and PCRE2 of the system), and the interpreter, which has no dependencies today and is watched for
# the day it gets one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /interpreter
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /trials/grep/rust
      - /trials/wc/rust
    schedule:
      interval: weekly
