[package]
name = "sg"
version = "0.1.0"
edition = "2021"
description = "The SG language: checker, tree-walking interpreter and a back end that compiles through C."
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sg"
path = "src/main.rs"

# `fuzzing` is set by cargo-fuzz when it builds the fuzz targets of `fuzz/` (choice 1352).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
