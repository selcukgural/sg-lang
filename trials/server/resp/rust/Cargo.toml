[package]
name = "resp"
version = "0.1.0"
edition = "2024"
publish = false

# `tokio` with its runtime of several threads, as `#[tokio::main]` makes it, one worker for each core
# this process may run on (choice 1701).
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
