[package]
name = "echo"
version = "0.1.0"
edition = "2024"
publish = false

# hyper 1's server of HTTP/1.1, the reference of the conformance comparison (choices 1772, 1794).
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
